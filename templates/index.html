<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Resumen de PDF</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <main>
    <h1>Resumen de PDF con IA</h1>
    <form id="form">
      <input type="file" id="archivo" accept=".pdf" required>
      <button type="submit" id="boton">Generar resumen</button>
    </form>
    <p id="estado"></p>
    <section id="resultado" hidden>
      <h2 id="titulo"></h2>
      <p id="texto"></p>
    </section>
  </main>
  <script type="module" src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
